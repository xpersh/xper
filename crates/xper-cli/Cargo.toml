[package]
name = "xper-cli"
description = "Command-line interface for xper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xper"
path = "src/main.rs"

[dependencies]
xper-application.workspace = true
xper-config.workspace = true
xper-protocol.workspace = true
xper-store-sqlite.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm_0_29"] }
crossterm = "0.29"
time = { version = "0.3", features = ["formatting"] }

[lints]
workspace = true
